name: Cloud Hunter V14 - deeper, resumable scans
on:
  workflow_dispatch:
  schedule:
    # Schedules run ONLY from the default branch, and can be delayed or dropped.
    - cron: "7,22,37,52 * * * *"
  push:
    branches:
      - feature/deep-scan-v14
    paths:
      - ".github/workflows/cloud-hunter.yml"
      - "cloud_hunter/scan.py"

permissions:
  contents: write

concurrency:
  group: cloud-hunter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout the branch (including stored datasets)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install upstream scraper
        run: |
          git clone --depth 1 https://github.com/SaldanhaC3/sonda-imperial.git /tmp/sonda-imperial
          python -m pip install "playwright>=1.44" "rich>=13.0"
          python -m playwright install --with-deps chromium
      - name: Scan deeper across categories (persist progress for next run)
        id: scan
        continue-on-error: true
        env:
          PYTHONPATH: /tmp/sonda-imperial
        run: python cloud_hunter/scan.py
      - name: Save real results and diagnostic status
        if: always()
        run: |
          if test -f cloud_hunter/data/status.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # Reset the index to the remote tip while preserving freshly collected
            # JSON working-tree files. This avoids rebasing conflicting JSON commits.
            for attempt in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              git reset --mixed "origin/${GITHUB_REF_NAME}"
              git add cloud_hunter/data/
              if git diff --cached --quiet; then
                echo "No data changes to commit."
                exit 0
              fi
              git commit -m "data: update cloud hunter results and run status"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              echo "Remote updated during scan; retrying from latest remote tip."
              sleep 2
            done
            exit 1
          else
            echo "No status JSON; scan may have failed before data creation."
            exit 1
          fi
      - name: Mark unsuccessful collection as a failed run
        if: steps.scan.outcome != 'success'
        run: exit 1
